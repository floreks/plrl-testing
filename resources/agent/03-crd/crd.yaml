apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: testresources.testing.plural.sh
  labels:
    test-scenario: crd-mixed
    test-type: crd
spec:
  group: testing.plural.sh
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              testName:
                type: string
              replicas:
                type: integer
                minimum: 1
                maximum: 10
              config:
                type: object
                additionalProperties:
                  type: string
          status:
            type: object
            properties:
              phase:
                type: string
                enum: ["Pending", "Running", "Failed", "Succeeded"]
              message:
                type: string
              lastUpdated:
                type: string
                format: date-time
  scope: Namespaced
  names:
    plural: testresources
    singular: testresource
    kind: TestResource
    shortNames:
    - tr
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: random-agent-config
  namespace: testing
  labels:
    test-scenario: crd-mixed
    test-type: configmap
data:
  APP_MODE: "chaos"
  FEATURE_FLAGS: "widgets,metrics,debug-panel"
  LOG_LEVEL: "trace"
---
apiVersion: v1
kind: Secret
metadata:
  name: random-agent-secret
  namespace: testing
  labels:
    test-scenario: crd-mixed
    test-type: secret
type: Opaque
stringData:
  username: "random-user"
  password: "random-password"
  api-token: "token-for-agent-tests"
---
apiVersion: v1
kind: Service
metadata:
  name: random-agent-service
  namespace: testing
  labels:
    test-scenario: crd-mixed
    test-type: service
spec:
  type: ClusterIP
  selector:
    app: random-agent
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: random-agent-deployment
  namespace: testing
  labels:
    test-scenario: crd-mixed
    test-type: deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: random-agent
  template:
    metadata:
      labels:
        app: random-agent
        test-scenario: crd-mixed
    spec:
      containers:
      - name: random-agent
        image: nginx:1.27-alpine
        ports:
        - name: http
          containerPort: 80
        env:
        - name: APP_MODE
          valueFrom:
            configMapKeyRef:
              name: random-agent-config
              key: APP_MODE
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: random-agent-secret
              key: api-token
