# Contain the letters of a critical name in order, but are not those components.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-banking-dns-proxy
  labels: {app: core-banking-dns-proxy, e2e: insights}
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  selector:
    matchLabels: {app: core-banking-dns-proxy}
  template:
    metadata:
      labels: {app: core-banking-dns-proxy, e2e: insights}
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: main
          image: busybox:1.37
          command: ["sh", "-c", 'echo "failing on $(hostname)"; exit 1']
          resources:
            requests: {cpu: 5m, memory: 8Mi}
