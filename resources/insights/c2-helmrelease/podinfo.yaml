# Needs Flux in the cluster (scenario c2-flux-install). The chart renders a Deployment whose image does not exist:
# the Flux-rendered children carry neither an owner reference nor the inventory annotation, which is what
# the agent has to remember from the HelmRelease.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: podinfo
spec:
  interval: 30m
  url: https://stefanprodan.github.io/podinfo
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo-broken
spec:
  interval: 10m
  install: {disableWait: true}
  upgrade: {disableWait: true}
  chart:
    spec:
      chart: podinfo
      version: "6.7.1"
      sourceRef: {kind: HelmRepository, name: podinfo}
  values:
    replicaCount: 2
    image:
      tag: this-tag-does-not-exist
