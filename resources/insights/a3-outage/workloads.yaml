# Full outage: no replica is ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-down
  labels: {app: api-down, e2e: insights}
spec:
  replicas: 2
  progressDeadlineSeconds: 60
  selector:
    matchLabels: {app: api-down}
  template:
    metadata:
      labels: {app: api-down, e2e: insights}
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: main
          image: busybox:1.37
          command: ["sh", "-c", 'echo "failing on $(hostname)"; exit 1']
          resources:
            requests: {cpu: 5m, memory: 8Mi}
---
# Partial: one of two replicas is ready (the pod on the second worker fails).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-partial
  labels: {app: api-partial, e2e: insights}
spec:
  replicas: 2
  progressDeadlineSeconds: 60
  selector:
    matchLabels: {app: api-partial}
  template:
    metadata:
      labels: {app: api-partial, e2e: insights}
    spec:
      terminationGracePeriodSeconds: 0
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app: api-partial}
      containers:
        - name: main
          image: busybox:1.37
          command: ["sh", "-c", 'case "$NODE_NAME" in *-worker2) echo "failing on $NODE_NAME"; exit 1;; *) exec sleep 86400;; esac']
          resources:
            requests: {cpu: 5m, memory: 8Mi}
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-down
  labels: {app: db-down, e2e: insights}
spec:
  replicas: 3
  serviceName: db-down
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: db-down}
  template:
    metadata:
      labels: {app: db-down, e2e: insights}
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: main
          image: busybox:1.37
          command: ["sh", "-c", 'echo "failing on $(hostname)"; exit 1']
          resources:
            requests: {cpu: 5m, memory: 8Mi}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
