apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-app-1
  labels: {app: broken-app-1, e2e: insights}
spec:
  replicas: 2
  progressDeadlineSeconds: 60
  selector:
    matchLabels: {app: broken-app-1}
  template:
    metadata:
      labels: {app: broken-app-1, e2e: insights}
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: main
          image: busybox:1.37
          command: ["sh", "-c", 'echo "failing on $(hostname)"; exit 1']
          resources:
            requests: {cpu: 5m, memory: 8Mi}
