# Labelled tier=core
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-checkout
  labels: {app: shop-checkout, e2e: insights, tier: core}
spec:
  replicas: 2
  progressDeadlineSeconds: 60
  selector:
    matchLabels: {app: shop-checkout}
  template:
    metadata:
      labels: {app: shop-checkout, e2e: insights, tier: core}
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: main
          image: busybox:1.37
          command: ["sh", "-c", 'echo "failing on $(hostname)"; exit 1']
          resources:
            requests: {cpu: 5m, memory: 8Mi}
