# Scale this 1 -> 3 -> 6 with kubectl and watch the score. Same failure, so the same score on the candidate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-demo
  namespace: kube-system
  labels: {app: scale-demo, e2e: insights}
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  selector:
    matchLabels: {app: scale-demo}
  template:
    metadata:
      labels: {app: scale-demo, e2e: insights}
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: main
          image: busybox:1.37
          command: ["sh", "-c", 'echo "failing on $(hostname)"; exit 1']
          resources:
            requests: {cpu: 5m, memory: 8Mi}
