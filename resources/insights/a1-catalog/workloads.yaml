# Names are what the catalog matches on. None of these are the real components: they only crashloop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns
  labels: {app: coredns, e2e: insights}
spec:
  replicas: 2
  progressDeadlineSeconds: 60
  selector:
    matchLabels: {app: coredns}
  template:
    metadata:
      labels: {app: coredns, e2e: insights}
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: main
          image: busybox:1.37
          command: ["sh", "-c", 'echo "failing on $(hostname)"; exit 1']
          resources:
            requests: {cpu: 5m, memory: 8Mi}
---
