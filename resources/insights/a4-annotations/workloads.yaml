# A plain app that would be MEDIUM, pinned up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pin-critical
  annotations:
    deployments.plural.sh/insight-priority: 'CRITICAL'
  labels: {app: pin-critical, e2e: insights}
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  selector:
    matchLabels: {app: pin-critical}
  template:
    metadata:
      labels: {app: pin-critical, e2e: insights}
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: main
          image: busybox:1.37
          command: ["sh", "-c", 'echo "failing on $(hostname)"; exit 1']
          resources:
            requests: {cpu: 5m, memory: 8Mi}
---
